<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cicero | Field Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="cicero-shell">
      <header class="topbar">
        <a class="back-link" href="../">← Field Atlas</a>
        <div class="wordmark"><span>CI</span><div><strong>Cicero</strong></div></div>
        <div class="status">LOCAL MODEL / V1</div>
      </header>

      <section class="intro"><p class="eyebrow">Organization profile</p><h1 id="cicero-heading">Major insurance enterprise</h1></section>

      <section class="workspace">
        <aside class="controls">
          <p class="eyebrow">Inputs</p>
          <label for="org-name">Organization label</label>
          <input id="org-name" value="Major insurance enterprise" />
          <label for="employee-count">Total employees</label>
          <input id="employee-count" type="number" min="1" step="100" value="390000" />
          <label for="source-note">Source note</label>
          <input id="source-note" value="Analyst estimate / local fixture" />
          <label for="confidence">Confidence</label>
          <input id="confidence" type="number" min="0" max="100" step="1" value="62" />
          <label for="assumptions">Assumptions</label>
          <input id="assumptions" value="Role shares are estimates; verify against organizational filings." />
          <div class="control-head"><span>Role distribution</span><button id="reset-button" type="button">Reset</button></div>
          <div id="role-inputs" class="role-inputs"></div>
          <button id="add-role" class="add-button" type="button">+ Add role</button>
        </aside>

        <section class="output">
          <div class="output-head">
            <div><p class="eyebrow">Generated profile</p><h2 id="profile-title">Major insurance enterprise</h2></div>
            <div class="total-badge"><span>allocated</span><strong id="allocation-total">100.0%</strong></div>
          </div>
          <div id="alert" class="alert" hidden></div>
          <div id="role-table" class="role-table"></div>
          <div class="export-row"><button id="export-context" class="add-button" type="button">Export as context object</button><span id="export-status"></span></div>
        </section>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
